<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🛍️ Product Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f8f9fa;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .filters {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .filters select,
    .filters input {
      padding: 8px;
      font-size: 14px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.2s;
    }

    .product:hover {
      transform: scale(1.02);
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .product h3 {
      margin: 5px 0;
    }

    .product p {
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <h1>🛒 Explore Our Products</h1>

  <div class="filters">
    <select id="categoryFilter">
      <option value="All">All Categories</option>
      <option value="Electronics">Electronics</option>
      <option value="Clothing">Clothing</option>
      <option value="Books">Books</option>
    </select>

    <input type="number" id="priceFilter" placeholder="Max Price (₹)" />

    <select id="sortOption">
      <option value="">Sort by Rating</option>
      <option value="high">Rating: High to Low</option>
      <option value="low">Rating: Low to High</option>
    </select>
  </div>

  <div class="product-grid" id="productList">
    <!-- Products will appear here -->
  </div>

  <script>
    const products = [
      {
        name: "Smartphone",
        category: "Electronics",
        price: 800,
        rating: 4.5,
        img: "https://m.media-amazon.com/images/I/71r69Y7BSeL._AC_UF894,1000_QL80_.jpg"
      },
      {
        name: "T-shirt",
        category: "Clothing",
        price: 300,
        rating: 4.0,
        img: "https://m.media-amazon.com/images/I/71eUwDk8z+L._UX522_.jpg"
      },
      {
        name: "Smartphone",
        category: "Electronics",
        price: 1200,
        rating: 4.7,
        img: "https://m.media-amazon.com/images/I/61-r9zOKBCL._AC_UY218_.jpg"
      },
      {
        name: "Novel Book",
        category: "Books",
        price: 150,
        rating: 4.8,
        img: "https://m.media-amazon.com/images/I/91bYsX41DVL._AC_UY218_.jpg"
      },
 ];

    const categoryFilter = document.getElementById("categoryFilter");
    const priceFilter = document.getElementById("priceFilter");
    const sortOption = document.getElementById("sortOption");
    const productList = document.getElementById("productList");

    function renderProducts() {
      const selectedCategory = categoryFilter.value;
      const maxPrice = priceFilter.value ? parseFloat(priceFilter.value) : Infinity;
      const sortType = sortOption.value;

      let filteredProducts = products.filter(product => {
        const inCategory = selectedCategory === "All" || product.category === selectedCategory;
        const inPriceRange = product.price <= maxPrice;
        return inCategory && inPriceRange;
      });

      if (sortType === "high") {
        filteredProducts.sort((a, b) => b.rating - a.rating);
      } else if (sortType === "low") {
        filteredProducts.sort((a, b) => a.rating - b.rating);
      }

      productList.innerHTML = "";
      filteredProducts.forEach(product => {
        const item = `
          <div class="product">
            <img src="${product.img}" alt="${product.name}">
            <h3>${product.name}</h3>
            <p>₹${product.price}</p>
            <p>Rating: ⭐ ${product.rating}</p>
          </div>
        `;
        productList.innerHTML += item;
      });
    }

    // Event Listeners
    categoryFilter.addEventListener("change", renderProducts);
    priceFilter.addEventListener("input", renderProducts);
    sortOption.addEventListener("change", renderProducts);

    // Initial Display
    renderProducts();
  </script>

</body>
</html>
