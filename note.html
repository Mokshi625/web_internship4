<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Note Keeper Pro</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    textarea, select {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: none;
    }

    button {
      padding: 0.8rem 1.5rem;
      background-color: #4e54c8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }

    .notes {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .note {
      background: white;
      padding: 1rem;
      border-left: 6px solid #4e54c8;
      border-radius: 8px;
      position: relative;
      word-wrap: break-word;
      transition: background 0.3s ease;
    }

    .note.done {
      background: #e0ffe0;
      text-decoration: line-through;
      color: #666;
    }

    .note .meta {
      font-size: 0.85rem;
      color: #555;
      margin-top: 0.3rem;
    }

    .buttons {
      position: absolute;
      top: 10px;
      right: 15px;
      display: flex;
      gap: 10px;
    }

    .buttons button {
      padding: 4px 8px;
      border: none;
      border-radius: 4px;
      background-color: #ddd;
      color: #333;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .buttons button:hover {
      background-color: #bbb;
    }

    @media (max-width: 600px) {
      .container {
        padding: 1rem;
      }

      textarea {
        height: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Note Keeper Pro</h1>

    <div class="input-area">
      <textarea id="noteInput" placeholder="Type your note..."></textarea>
      <select id="categorySelect">
        <option value="General">🗂️ General</option>
        <option value="Personal">🏠 Personal</option>
        <option value="Work">💼 Work</option>
        <option value="Study">📖 Study</option>
      </select>
      <button id="addBtn">Add Note</button>
    </div>

    <div class="notes" id="notesList"></div>
  </div>

  <script>
    const noteInput = document.getElementById('noteInput');
    const categorySelect = document.getElementById('categorySelect');
    const notesList = document.getElementById('notesList');
    const addBtn = document.getElementById('addBtn');

    window.onload = displayNotes;

    addBtn.addEventListener('click', () => {
      const noteText = noteInput.value.trim();
      const category = categorySelect.value;

      if (noteText !== "") {
        const timestamp = new Date().toLocaleString();
        const notes = JSON.parse(localStorage.getItem('notes')) || [];

        notes.push({
          text: noteText,
          category: category,
          time: timestamp,
          done: false
        });

        localStorage.setItem('notes', JSON.stringify(notes));
        noteInput.value = "";
        displayNotes();
      }
    });

    function displayNotes() {
      const notes = JSON.parse(localStorage.getItem('notes')) || [];
      notesList.innerHTML = "";

      notes.forEach((note, index) => {
        const noteCard = document.createElement('div');
        noteCard.className = 'note' + (note.done ? ' done' : '');
        noteCard.innerHTML = `
          <div><strong>${note.category}</strong>: ${note.text}</div>
          <div class="meta">🕒 ${note.time}</div>
          <div class="buttons">
            <button onclick="toggleDone(${index})">${note.done ? 'Undo' : 'Done'}</button>
            <button onclick="deleteNote(${index})">Delete</button>
          </div>
        `;
        notesList.appendChild(noteCard);
      });
    }

    function toggleDone(index) {
      const notes = JSON.parse(localStorage.getItem('notes'));
      notes[index].done = !notes[index].done;
      localStorage.setItem('notes', JSON.stringify(notes));
      displayNotes();
    }

    function deleteNote(index) {
      const notes = JSON.parse(localStorage.getItem('notes'));
      notes.splice(index, 1);
      localStorage.setItem('notes', JSON.stringify(notes));
      displayNotes();
    }
  </script>
</body>
</html>
